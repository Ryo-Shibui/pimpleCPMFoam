name: Expand source archive

on:
  push:
    paths:
      - 'pimpleCPMFoam-source.zip'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Expand source archive
        run: |
          unzip -o pimpleCPMFoam-source.zip
          rm -f pimpleCPMFoam-source.zip
          rm -f .github/workflows/expand-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Expand source archive"
            git push
          fi
